<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Add Button Handler
        document.addEventListener('click', function (e) {
            if (e.target.closest('span.add_button')) {
                const container = document.querySelectorAll('.multipleinput_new');
                const lastElement = container[container.length - 1];
                const inputs = lastElement.querySelectorAll('input');
                const lastValue = parseInt(inputs[0].value);

                let nextValue = '';
                if (!isNaN(lastValue) && lastValue >= 0) {
                    nextValue = lastValue + 1;
                }

                const clone = lastElement.cloneNode(true);
                document.getElementById('input_colletion').appendChild(clone);

                const clonedInputs = clone.querySelectorAll('input');
                if (clonedInputs.length > 0) {
                    clonedInputs[0].value = nextValue;
                    clonedInputs[clonedInputs.length - 1].value = '';
                    clonedInputs[clonedInputs.length - 1].focus();
                }

                // Fade-in effect (optional)
                clone.style.opacity = 0;
                clone.style.transition = 'opacity 0.5s';
                requestAnimationFrame(() => {
                    clone.style.opacity = 1;
                });

                e.preventDefault();
            }
        });

        // Delete Button Handler
        const deleteButtons = document.querySelectorAll('span.delete_button');
        deleteButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                const mydiff = btn.closest('.multipleinput_new'); // Assumes three parents up
                if (mydiff) {
                    mydiff.querySelectorAll('input').forEach(input => input.value = '');
                    mydiff.style.transition = 'opacity 0.5s';
                    mydiff.style.opacity = 1;
                    requestAnimationFrame(() => {
                        mydiff.style.opacity = 0;
                        setTimeout(() => {
                            mydiff.style.display = 'none';
                        }, 500);
                    });
                }
            });
        });

        // Row sorting is handled by templates/js/sortable.js, which auto-inits
        // every table containing tr.fsxSortable rows using the move icon as handle.
    });
</script>
<style>
    .locked {
        display: none;
    }
</style>
<table id='input_colletion'>
    <!-- BEGIN input -->
    <tr class='multipleinput_old fsxSortable'>
        <td style="width: 30px" class="{LOCK_CSS}">
            <img src="./Customizing/global/plugins/Services/Repository/RepositoryObject/SelfEvaluation/templates/images/move.png">
        </td>
        <td><input type="hidden" name="{POSTVAR}_position[]" value="{ID}"><input {DISABLED} style='float: left;'
                                                                                 type='text'
                                                                                 name='{VALUE_N}' value='{VALUE_V}'>
        </td>
        <td><input {DISABLED} style='float: left;' type='text' name='{TITLE_N}' value='{TITLE_V}'></td>
        <td class="{LOCK_CSS}"><a><span class="glyphicon glyphicon-minus delete_button" aria-hidden="true"></span></a>
        </td>
    </tr>
    <!-- END input -->
    <!-- BEGIN new_input -->
    <tr class='multipleinput_new'>
        <td class="{LOCK_CSS}"></td>
        <td><input {DISABLED_N} style='float: left' type='text' name='{VALUE_N_NEW}' value='{DEFAULT_VALUE}'
                   placeholder="{PLACEHOLDER_VALUE}">
        </td>
        <td><input {DISABLED_N} style='float: left' type='text' name='{TITLE_N_NEW}' value=''
                   placeholder="{PLACEHOLDER_TITLE}">
        </td>
        <td class="{LOCK_CSS}"><a><span class="glyphicon glyphicon-plus add_button" aria-hidden="true"></span></a></td>
    </tr>
    <!-- END new_input -->
</table>
<div class="ilFormInfo">{DESCRIPTION}</div>
